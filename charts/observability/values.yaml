# Observability Subchart Values
# This subchart provides monitoring and tracing capabilities

# =============================================================================
# PROMETHEUS MONITORING
# =============================================================================
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  additionalLabels: {}

prometheusRules:
  enabled: false
  additionalLabels: {}
  groups: []
    # - name: example-alerts
    #   interval: 30s
    #   rules:
    #     - alert: HighErrorRate
    #       expr: rate(http_requests_total{status="500"}[5m]) > 0.05
    #       for: 5m
    #       labels:
    #         severity: critical
    #       annotations:
    #         summary: "High error rate detected"

# =============================================================================
# OPENTELEMETRY
# =============================================================================
openTelemetry:
  # OpenTelemetry Collector
  enabled: false
  mode: deployment # deployment, daemonset, statefulset

  # Collector configuration
  config: |
    exporters:
      otlphttp:
        endpoint: "http://tempo-distributor.grafana-lgtm.svc.cluster.local:4318"
      loki:
        endpoint: "http://loki-gateway.grafana-lgtm.svc.cluster.local/loki/api/v1/push"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp, k8s_events]
          processors: [memory_limiter, batch]
          exporters: [loki, logging]

  # Auto-instrumentation
  instrumentation:
    enabled: false
    sampler:
      type: parentbased_traceidratio
      argument: "1"
    language: java # java, python, dotnet, nodejs, go, ruby, php, apacheHttpd

serviceAccount:
  create: true
  annotations: {}
  name: ""
