{{- if .Values.secretStore.enabled -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "chartname.fullname" . }}
  labels:
    {{- include "chartname.labels" . | nindent 4 }}
spec:
  provider:
    oracle:
      vault: {{ required "secretStore.vaultOCID is required" .Values.secretStore.vaultOCID }}
      region: {{ .Values.secretStore.region }}
      principalType: {{ .Values.secretStore.principalType | default "InstancePrincipal" }}
      {{- if eq .Values.secretStore.principalType "UserPrincipal" }}
      auth:
        user: {{ .Values.secretStore.user }}
        tenancy: {{ .Values.secretStore.tenancy }}
        secretRef:
          privatekey:
            name: oracle-secret
            key: privateKey
          fingerprint:
            name: oracle-secret
            key: fingerprint
      {{- end }}
{{- end }}
